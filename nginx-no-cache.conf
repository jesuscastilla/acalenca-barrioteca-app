# ─────────────────────────────────────────────────────────────
#  Sin caché para la app web de la Barrioteca (Nginx)
#  Añade este bloque DENTRO del server { ... } que sirve
#  pelotxo.synology.me / /barrioteca/ en el NAS.
# ─────────────────────────────────────────────────────────────

location /barrioteca/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
}
